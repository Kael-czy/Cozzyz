<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cozzyz</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --school: #e53e3e;
    --other: #38a169;
    --entertainment: #805ad5;
    --google: #4285f4;
    --bg: #0f1115;
    --card: #181b22;
    --card2: #1f232c;
    --text: #e8e8ec;
    --muted: #9aa0ad;
    --border: #2a2f3a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  #app { display: none; max-width: 760px; margin: 0 auto; padding: 16px 16px 80px; }
  #gate {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 14px;
    padding: 20px;
  }
  #gate h1 { margin: 0 0 4px; font-size: 1.4rem; }
  #gate input {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 1rem;
    width: 240px;
    text-align: center;
  }
  #gate button {
    background: #4f66f0;
    color: white;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  #gateError { color: var(--school); font-size: 0.85rem; min-height: 1em; }
  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 18px 0 10px;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 1.5rem; margin: 0; }
  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  .tabs button {
    flex: 1;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.95rem;
  }
  .tabs button.active {
    background: #4f66f0;
    border-color: #4f66f0;
  }
  #gcalBtn {
    background: var(--card2);
    border: 1px dashed var(--border);
    color: var(--muted);
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  #gcalBtn.connected {
    border: 1px solid var(--google);
    color: var(--google);
    cursor: default;
  }
  #gcalStatus { font-size: 0.72rem; color: var(--muted); width: 100%; text-align: right; }
  .quickadd { display: flex; gap: 8px; margin-bottom: 16px; }
  .quickadd input {
    flex: 1;
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 10px;
    font-size: 0.92rem;
  }
  .quickadd button {
    background: #4f66f0;
    color: white;
    border: none;
    padding: 10px 16px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.92rem;
    flex-shrink: 0;
  }
  .quickadd-hint { color: var(--muted); font-size: 0.75rem; margin: -10px 0 16px; }
  .view { display: none; }
  .view.active { display: block; }
  .agenda-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border-left: 5px solid var(--muted);
  }
  .agenda-item.school { border-left-color: var(--school); background: linear-gradient(90deg, rgba(229,62,62,0.12), var(--card) 40%); }
  .agenda-item.other { border-left-color: var(--other); background: linear-gradient(90deg, rgba(56,161,105,0.12), var(--card) 40%); }
  .agenda-item.entertainment { border-left-color: var(--entertainment); background: linear-gradient(90deg, rgba(128,90,213,0.12), var(--card) 40%); }
  .agenda-item.google { border-left-color: var(--google); background: linear-gradient(90deg, rgba(66,133,244,0.12), var(--card) 40%); }
  .agenda-item.goal { border-left-color: #f5f5f5; background: linear-gradient(90deg, rgba(245,245,245,0.14), var(--card) 40%); }
  .agenda-item.goal.escalated {
    border-left-color: #ffd700;
    animation: dazzle 1.8s ease-in-out infinite;
  }
  @keyframes dazzle {
    0%, 100% { box-shadow: 0 0 0 rgba(255,215,0,0); }
    50% { box-shadow: 0 0 16px rgba(255,215,0,0.55); }
  }
  .agenda-item.done { opacity: 0.45; }
  .goal-star { margin-right: 4px; }
  .agenda-main { flex: 1; min-width: 0; }
  .agenda-title { font-weight: 600; font-size: 1rem; }
  .agenda-title.strike { text-decoration: line-through; }
  .agenda-meta { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }
  .cat-pill {
    font-size: 0.7rem;
    padding: 2px 8px;
    border-radius: 999px;
    color: white;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .cat-pill.school { background: var(--school); }
  .cat-pill.other { background: var(--other); }
  .cat-pill.entertainment { background: var(--entertainment); }
  .cat-pill.google { background: var(--google); }
  .cat-pill.goal { background: #f5f5f5; color: #15171c; }
  .cat-pill.urgent { background: #ffd700; color: #15171c; }
  .agenda-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 32px;
    height: 32px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }
  .empty-state { color: var(--muted); text-align: center; padding: 40px 0; }
  .agenda-section-header {
    color: var(--muted);
    font-size: 0.78rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin: 18px 0 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }
  .agenda-section-header:first-child { margin-top: 0; }
  .fab {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #4f66f0;
    color: white;
    border: none;
    font-size: 1.6rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
  }
  .cal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .cal-header button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .cal-dow { text-align: center; color: var(--muted); font-size: 0.75rem; padding-bottom: 4px; }
  .cal-day {
    aspect-ratio: 1;
    background: var(--card);
    border-radius: 8px;
    border: 1px solid var(--border);
    padding: 4px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    position: relative;
  }
  .cal-day.empty { background: transparent; border: none; cursor: default; }
  .cal-day.today { border-color: #4f66f0; }
  .cal-day-num { font-size: 0.78rem; color: var(--muted); }
  .cal-dots { display: flex; gap: 3px; flex-wrap: wrap; margin-top: auto; }
  .cal-dot { width: 7px; height: 7px; border-radius: 50%; }
  .cal-dot.school { background: var(--school); }
  .cal-dot.other { background: var(--other); }
  .cal-dot.entertainment { background: var(--entertainment); }
  .cal-dot.google { background: var(--google); }
  .cal-dot.goal { background: #f5f5f5; border: 1px solid #999; }
  .day-detail {
    margin-top: 14px;
    background: var(--card);
    border-radius: 12px;
    padding: 12px;
  }
  .day-detail h3 { margin: 0 0 8px; font-size: 1rem; }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--card);
    border-radius: 14px;
    padding: 20px;
    width: 100%;
    max-width: 380px;
  }
  .modal h2 { margin-top: 0; font-size: 1.15rem; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 8px;
    font-size: 0.95rem;
  }
  .modal-actions { display: flex; gap: 8px; margin-top: 16px; }
  .modal-actions button { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; font-size: 0.95rem; }
  .btn-primary { background: #4f66f0; color: white; }
  .btn-secondary { background: var(--card2); color: var(--text); border: 1px solid var(--border) !important; }
  .btn-danger { background: var(--school); color: white; }
  footer.app-footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 20px 0 0; }
</style>
</head>
<body>

<div id="gate">
  <h1>Cozzyz</h1>
  <p style="color:var(--muted); margin-top:-8px;">Enter passcode to continue</p>
  <input type="password" id="gateInput" placeholder="Passcode" autocomplete="off" />
  <button id="gateBtn">Unlock</button>
  <div id="gateError"></div>
</div>

<div id="app">
  <header>
    <h1>Cozzyz</h1>
    <button id="gcalBtn" title="Connect your Google Calendar">Connect Google Calendar</button>
    <div id="gcalStatus"></div>
  </header>

  <div class="tabs">
    <button id="tabAgendaBtn" class="active">Agenda</button>
    <button id="tabCalendarBtn">Calendar</button>
  </div>

  <div class="quickadd">
    <input type="text" id="quickAddInput" placeholder='e.g. &quot;Book my time Saturday 10pm to 12am for movie night&quot;' autocomplete="off" />
    <button id="quickAddBtn">Add</button>
  </div>
  <div class="quickadd-hint" id="quickAddHint"></div>

  <div id="agendaView" class="view active">
    <div id="agendaList"></div>
  </div>

  <div id="calendarView" class="view">
    <div class="cal-header">
      <button id="prevMonth">&larr;</button>
      <strong id="calMonthLabel"></strong>
      <button id="nextMonth">&rarr;</button>
    </div>
    <div class="cal-grid" id="calDow"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div id="dayDetail" class="day-detail" style="display:none;"></div>
  </div>

  <footer class="app-footer">Cozzyz &middot; data stored in Supabase &middot; syncs with Google Calendar</footer>
</div>

<button class="fab" id="addFab" style="display:none;">+</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2 id="modalTitle">Add Task</h2>
    <input type="hidden" id="taskId" />
    <div class="field">
      <label>Title</label>
      <input type="text" id="taskTitleInput" placeholder="e.g. Submit assignment" />
    </div>
    <div class="field">
      <label>Date &amp; time</label>
      <input type="datetime-local" id="taskDueInput" />
    </div>
    <div class="field">
      <label>Duration (minutes)</label>
      <input type="number" id="taskDurationInput" min="5" step="5" value="60" />
    </div>
    <div class="field">
      <label>Category</label>
      <select id="taskCategoryInput">
        <option value="school">School</option>
        <option value="other">Other</option>
        <option value="entertainment">Entertainment</option>
      </select>
    </div>
    <div class="field">
      <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
        <input type="checkbox" id="taskIsGoalInput" style="width:auto;" />
        This is a goal (something to achieve, highlighted in white)
      </label>
    </div>
    <div class="field" id="goalIntervalField" style="display:none;">
      <label>If missed, reset it for</label>
      <select id="taskGoalIntervalInput">
        <option value="day">A day later</option>
        <option value="week">A week later</option>
        <option value="fortnight">A fortnight later</option>
        <option value="month">A month later</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" id="modalCancel">Cancel</button>
      <button class="btn-danger" id="modalDelete" style="display:none;">Delete</button>
      <button class="btn-primary" id="modalSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="goalCheckOverlay">
  <div class="modal">
    <h2>Goal check-in</h2>
    <p id="goalCheckText" style="color:var(--muted);"></p>
    <div class="modal-actions">
      <button class="btn-secondary" id="goalCheckNo">Not yet</button>
      <button class="btn-primary" id="goalCheckYes">Done!</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var SUPABASE_URL = "https://dnrumlfxnqbqxbkxdzum.supabase.co";
  var SUPABASE_KEY = "sb_publishable_gYGE2QVBELzeiP1KqB1_cA_WEDtVgmw";
  var TABLE = "cozzyz_tasks";
  var PASSCODE = "cozzyz2026";
  var SESSION_KEY = "cozzyz_unlocked";

  // --- Google Calendar sync config ---
  var GCAL_CLIENT_ID = "483435323151-0n5tdi81e6gr7nlrtokva1o47ki6smem.apps.googleusercontent.com";
  var GCAL_SCOPE = "https://www.googleapis.com/auth/calendar.events";
  var GCAL_TOKEN_KEY = "cozzyz_gcal_token";
  var GCAL_EVER_CONNECTED_KEY = "cozzyz_gcal_ever_connected";

  var gcalTokenClient = null;
  var gcalAccessToken = null;
  var gcalTokenExpiresAt = 0;
  var gcalEvents = []; // events pulled from Google Calendar (read-only display)

  var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var tasks = [];
  var currentView = "agenda";
  var calCursor = new Date();
  var selectedDayKey = null;

  var CATS = ["school", "other", "entertainment"];

  function tryUnlock() {
    var val = document.getElementById("gateInput").value;
    if (val === PASSCODE) {
      sessionStorage.setItem(SESSION_KEY, "1");
      enterApp();
    } else {
      document.getElementById("gateError").textContent = "Incorrect passcode.";
    }
  }

  document.getElementById("gateBtn").addEventListener("click", tryUnlock);
  document.getElementById("gateInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") tryUnlock();
  });

  function enterApp() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "block";
    document.getElementById("addFab").style.display = "block";
    init();
  }

  if (sessionStorage.getItem(SESSION_KEY) === "1") {
    enterApp();
  }

  function init() {
    ensureAuth().then(function () {
      loadTasks();
    });
    initGoogleCalendar();
  }

  function ensureAuth() {
    return supabase.auth.getSession().then(function (res) {
      if (res.data && res.data.session) return res.data.session;
      return supabase.auth.signInWithPassword({ email: "cozzyz@kaelapp.local", password: "Cz9rT2xVwL5mQ8fA!" }).then(function (r) {
        if (r.error) {
          console.error("Sign-in failed:", r.error.message);
        }
        return r.data && r.data.session;
      });
    });
  }

  var goalCheckRan = false;

  function loadTasks() {
    supabase.from(TABLE).select("*").order("due_at", { ascending: true }).then(function (res) {
      if (res.error) {
        console.error("Load error:", res.error.message);
        tasks = [];
      } else {
        tasks = res.data || [];
      }
      renderAgenda();
      renderCalendar();
      if (!goalCheckRan) {
        goalCheckRan = true;
        checkEndOfDayGoals();
      }
    });
  }

  function addTask(task) {
    return supabase.from(TABLE).insert(task).select();
  }

  function updateTask(id, patch) {
    return supabase.from(TABLE).update(patch).eq("id", id);
  }

  function deleteTask(id) {
    return supabase.from(TABLE).delete().eq("id", id);
  }

  // ===================== Goals: end-of-day check-in =====================

  function startOfToday() {
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    return d;
  }

  function computeNextGoalDue(interval) {
    var d = new Date();
    d.setHours(9, 0, 0, 0);
    if (interval === "week") d.setDate(d.getDate() + 7);
    else if (interval === "fortnight") d.setDate(d.getDate() + 14);
    else if (interval === "month") d.setMonth(d.getMonth() + 1);
    else d.setDate(d.getDate() + 1); // default: "day"
    return d.toISOString();
  }

  function checkEndOfDayGoals() {
    var today0 = startOfToday();
    var pending = tasks.filter(function (t) {
      return t.is_goal && !t.done && new Date(t.due_at) < today0;
    });
    if (pending.length === 0) return;
    askGoalQueue(pending.slice());
  }

  var goalCheckOverlay = document.getElementById("goalCheckOverlay");
  var goalCheckCallback = null;

  function showGoalCheckModal(goal, cb) {
    goalCheckCallback = cb;
    document.getElementById("goalCheckText").textContent = 'Did you complete "' + goal.title + '"?';
    goalCheckOverlay.classList.add("open");
  }

  document.getElementById("goalCheckYes").addEventListener("click", function () {
    goalCheckOverlay.classList.remove("open");
    var cb = goalCheckCallback;
    goalCheckCallback = null;
    if (cb) cb(true);
  });
  document.getElementById("goalCheckNo").addEventListener("click", function () {
    goalCheckOverlay.classList.remove("open");
    var cb = goalCheckCallback;
    goalCheckCallback = null;
    if (cb) cb(false);
  });

  function askGoalQueue(queue) {
    if (queue.length === 0) {
      loadTasks();
      return;
    }
    var goal = queue.shift();
    showGoalCheckModal(goal, function (completed) {
      if (completed) {
        updateTask(goal.id, { done: true, escalated: false }).then(function () {
          if (goal.gcal_event_id) pushTaskDelete(goal.gcal_event_id);
          askGoalQueue(queue);
        });
      } else {
        var newDue = computeNextGoalDue(goal.goal_reset_interval);
        updateTask(goal.id, { due_at: newDue, escalated: true }).then(function () {
          var updated = Object.assign({}, goal, { due_at: newDue });
          if (goal.gcal_event_id) pushTaskUpdate(updated);
          askGoalQueue(queue);
        });
      }
    });
  }

  // ===================== Google Calendar two-way sync =====================

  function initGoogleCalendar() {
    var btn = document.getElementById("gcalBtn");

    function setupClient() {
      if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
        setTimeout(setupClient, 300);
        return;
      }
      gcalTokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GCAL_CLIENT_ID,
        scope: GCAL_SCOPE,
        callback: function (resp) {
          if (resp && resp.access_token) {
            gcalAccessToken = resp.access_token;
            gcalTokenExpiresAt = Date.now() + (parseInt(resp.expires_in, 10) || 3500) * 1000;
            try {
              localStorage.setItem(GCAL_TOKEN_KEY, JSON.stringify({ token: gcalAccessToken, exp: gcalTokenExpiresAt }));
              localStorage.setItem(GCAL_EVER_CONNECTED_KEY, "1");
            } catch (e) {}
            setGcalConnectedUI(true);
            pullGoogleEvents();
          }
        }
      });

      // try to resume a still-valid token from a previous session
      try {
        var stored = JSON.parse(localStorage.getItem(GCAL_TOKEN_KEY) || "null");
        if (stored && stored.token && stored.exp > Date.now() + 60000) {
          gcalAccessToken = stored.token;
          gcalTokenExpiresAt = stored.exp;
          setGcalConnectedUI(true);
          pullGoogleEvents();
        } else if (localStorage.getItem(GCAL_EVER_CONNECTED_KEY) === "1") {
          // attempt a silent (no prompt) reconnect
          gcalTokenClient.requestAccessToken({ prompt: "" });
        }
      } catch (e) {}
    }
    setupClient();

    btn.addEventListener("click", function () {
      if (isGcalConnected()) return;
      if (gcalTokenClient) {
        gcalTokenClient.requestAccessToken({ prompt: "consent" });
      }
    });
  }

  function isGcalConnected() {
    return !!gcalAccessToken && gcalTokenExpiresAt > Date.now();
  }

  function setGcalConnectedUI(connected) {
    var btn = document.getElementById("gcalBtn");
    var status = document.getElementById("gcalStatus");
    if (connected) {
      btn.textContent = "Google Calendar: Connected";
      btn.classList.add("connected");
      status.textContent = "Two-way sync active";
    } else {
      btn.textContent = "Connect Google Calendar";
      btn.classList.remove("connected");
      status.textContent = "";
    }
  }

  function gcalFetch(path, options) {
    options = options || {};
    options.headers = options.headers || {};
    options.headers["Authorization"] = "Bearer " + gcalAccessToken;
    options.headers["Content-Type"] = "application/json";
    return fetch("https://www.googleapis.com/calendar/v3/calendars/primary/" + path, options)
      .then(function (r) {
        if (!r.ok) {
          return r.text().then(function (t) { throw new Error("Google Calendar API error " + r.status + ": " + t); });
        }
        if (r.status === 204) return null;
        return r.json();
      });
  }

  function pullGoogleEvents() {
    if (!isGcalConnected()) return;
    var now = new Date();
    var timeMin = new Date(now.getFullYear(), now.getMonth() - 1, 1).toISOString();
    var timeMax = new Date(now.getFullYear(), now.getMonth() + 3, 1).toISOString();
    var q = "events?timeMin=" + encodeURIComponent(timeMin) + "&timeMax=" + encodeURIComponent(timeMax) +
      "&singleEvents=true&orderBy=startTime&maxResults=250";
    gcalFetch(q).then(function (data) {
      var items = (data && data.items) || [];
      var cozzyzEventIds = {};
      tasks.forEach(function (t) { if (t.gcal_event_id) cozzyzEventIds[t.gcal_event_id] = true; });
      gcalEvents = items
        .filter(function (ev) { return !cozzyzEventIds[ev.id]; }) // don't double-show items Cozzyz itself created
        .filter(function (ev) { return ev.start && (ev.start.dateTime || ev.start.date); })
        .map(function (ev) {
          var startStr = ev.start.dateTime || (ev.start.date + "T00:00:00");
          return {
            id: "gcal_" + ev.id,
            gcal_id: ev.id,
            title: ev.summary || "(untitled Google event)",
            due_at: new Date(startStr).toISOString(),
            category: "google",
            done: false,
            source: "google"
          };
        });
      renderAgenda();
      renderCalendar();
    }).catch(function (err) {
      console.error("Pull from Google Calendar failed:", err.message);
    });
  }

  function gcalSummaryFor(task) {
    if (task.is_goal) {
      return (task.escalated ? "[GOAL - MISSED, RESCHEDULED] " : "[GOAL] ") + task.title;
    }
    return "[" + task.category + "] " + task.title;
  }

  function pushTaskCreate(task) {
    if (!isGcalConnected()) return Promise.resolve(null);
    var start = new Date(task.due_at);
    var mins = task.duration_minutes || 60;
    var end = new Date(start.getTime() + mins * 60 * 1000);
    var body = {
      summary: gcalSummaryFor(task),
      start: { dateTime: start.toISOString() },
      end: { dateTime: end.toISOString() }
    };
    return gcalFetch("events", { method: "POST", body: JSON.stringify(body) })
      .then(function (ev) { return ev && ev.id; })
      .catch(function (err) { console.error("Push create to Google Calendar failed:", err.message); return null; });
  }

  function pushTaskUpdate(task) {
    if (!isGcalConnected() || !task.gcal_event_id) return Promise.resolve(null);
    var start = new Date(task.due_at);
    var mins = task.duration_minutes || 60;
    var end = new Date(start.getTime() + mins * 60 * 1000);
    var body = {
      summary: gcalSummaryFor(task),
      start: { dateTime: start.toISOString() },
      end: { dateTime: end.toISOString() }
    };
    return gcalFetch("events/" + encodeURIComponent(task.gcal_event_id), { method: "PATCH", body: JSON.stringify(body) })
      .catch(function (err) { console.error("Push update to Google Calendar failed:", err.message); return null; });
  }

  function pushTaskDelete(gcalEventId) {
    if (!isGcalConnected() || !gcalEventId) return Promise.resolve(null);
    return gcalFetch("events/" + encodeURIComponent(gcalEventId), { method: "DELETE" })
      .catch(function (err) { console.error("Push delete to Google Calendar failed:", err.message); return null; });
  }

  // ===================== View switching =====================

  document.getElementById("tabAgendaBtn").addEventListener("click", function () { switchView("agenda"); });
  document.getElementById("tabCalendarBtn").addEventListener("click", function () { switchView("calendar"); });

  function switchView(v) {
    currentView = v;
    document.getElementById("tabAgendaBtn").classList.toggle("active", v === "agenda");
    document.getElementById("tabCalendarBtn").classList.toggle("active", v === "calendar");
    document.getElementById("agendaView").classList.toggle("active", v === "agenda");
    document.getElementById("calendarView").classList.toggle("active", v === "calendar");
  }

  function fmtDateTime(d) {
    var opts = { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" };
    return d.toLocaleString(undefined, opts);
  }

  function allItems() {
    return tasks.map(function (t) {
      t.source = t.source || "cozzyz";
      return t;
    }).concat(gcalEvents);
  }

  function startOfDay(d) {
    var x = new Date(d);
    x.setHours(0, 0, 0, 0);
    return x;
  }

  function sortByEscalatedThenTime(a, b) {
    var ae = a.escalated ? 1 : 0, be = b.escalated ? 1 : 0;
    if (ae !== be) return be - ae; // escalated (previously-missed) goals jump to the front
    return new Date(a.due_at) - new Date(b.due_at);
  }

  function renderAgenda() {
    var list = document.getElementById("agendaList");
    list.innerHTML = "";
    var items = allItems();

    var today0 = startOfDay(new Date());
    var tomorrow0 = new Date(today0); tomorrow0.setDate(tomorrow0.getDate() + 1);
    var dayAfter0 = new Date(today0); dayAfter0.setDate(dayAfter0.getDate() + 2);

    // escalated (missed-and-rescheduled) goals always surface, no matter which day they landed on
    var escalatedItems = items.filter(function (t) { return t.escalated && !t.done; }).sort(sortByEscalatedThenTime);
    var escalatedIds = {};
    escalatedItems.forEach(function (t) { escalatedIds[t.id] = true; });

    var todayItems = items
      .filter(function (t) {
        var d = new Date(t.due_at);
        return d >= today0 && d < tomorrow0 && !escalatedIds[t.id];
      })
      .sort(sortByEscalatedThenTime);

    var tomorrowItems = items
      .filter(function (t) {
        var d = new Date(t.due_at);
        return d >= tomorrow0 && d < dayAfter0 && !escalatedIds[t.id];
      })
      .sort(sortByEscalatedThenTime);

    if (escalatedItems.length === 0 && todayItems.length === 0 && tomorrowItems.length === 0) {
      list.innerHTML = '<div class="empty-state">Nothing scheduled for today or tomorrow. Tap + to add a task.</div>';
      return;
    }

    function addSection(label, arr) {
      if (arr.length === 0) return;
      var header = document.createElement("div");
      header.className = "agenda-section-header";
      header.textContent = label;
      list.appendChild(header);
      arr.forEach(function (t) { list.appendChild(renderAgendaItem(t)); });
    }

    addSection("⚡ Needs attention", escalatedItems);
    addSection("Today", todayItems);
    addSection("Tomorrow", tomorrowItems);
  }

  function renderAgendaItem(t) {
    var el = document.createElement("div");
    var cls = "agenda-item " + t.category + (t.done ? " done" : "");
    if (t.is_goal) cls += " goal" + (t.escalated ? " escalated" : "");
    el.className = cls;
    var due = new Date(t.due_at);
    var isGoogle = t.source === "google";

    var main = document.createElement("div");
    main.className = "agenda-main";

    var titleRow = document.createElement("div");
    titleRow.className = "agenda-title" + (t.done ? " strike" : "");
    if (t.is_goal) {
      var star = document.createElement("span");
      star.className = "goal-star";
      star.textContent = t.escalated ? "⚡" : "★";
      titleRow.appendChild(star);
    }
    titleRow.appendChild(document.createTextNode(t.title));

    var meta = document.createElement("div");
    meta.className = "agenda-meta";
    meta.appendChild(document.createTextNode(fmtDateTime(due) + "  "));

    if (t.is_goal) {
      var goalPill = document.createElement("span");
      goalPill.className = t.escalated ? "cat-pill urgent" : "cat-pill goal";
      goalPill.textContent = t.escalated ? "missed - rescheduled" : "goal";
      meta.appendChild(goalPill);
      meta.appendChild(document.createTextNode(" "));
    }

    var pill = document.createElement("span");
    pill.className = "cat-pill " + t.category;
    pill.textContent = isGoogle ? "google" : t.category;
    meta.appendChild(pill);

    main.appendChild(titleRow);
    main.appendChild(meta);

    var actions = document.createElement("div");
    actions.className = "agenda-actions";

    if (!isGoogle) {
      var doneBtn = document.createElement("button");
      doneBtn.className = "icon-btn";
      doneBtn.textContent = t.done ? "↺" : "✓";
      doneBtn.title = t.done ? "Mark not done" : "Mark done";
      doneBtn.addEventListener("click", function () {
        var patch = { done: !t.done };
        if (!t.done && t.is_goal) patch.escalated = false;
        updateTask(t.id, patch).then(loadTasks);
      });

      var editBtn = document.createElement("button");
      editBtn.className = "icon-btn";
      editBtn.textContent = "✎";
      editBtn.title = "Edit";
      editBtn.addEventListener("click", function () { openModal(t); });

      actions.appendChild(doneBtn);
      actions.appendChild(editBtn);
    }

    el.appendChild(main);
    el.appendChild(actions);
    return el;
  }

  document.getElementById("prevMonth").addEventListener("click", function () {
    calCursor.setMonth(calCursor.getMonth() - 1);
    renderCalendar();
  });
  document.getElementById("nextMonth").addEventListener("click", function () {
    calCursor.setMonth(calCursor.getMonth() + 1);
    renderCalendar();
  });

  function dayKey(d) {
    return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
  }

  function renderCalendar() {
    var dowEl = document.getElementById("calDow");
    dowEl.innerHTML = "";
    ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(function (d) {
      var e = document.createElement("div");
      e.className = "cal-dow";
      e.textContent = d;
      dowEl.appendChild(e);
    });

    var year = calCursor.getFullYear();
    var month = calCursor.getMonth();
    document.getElementById("calMonthLabel").textContent =
      calCursor.toLocaleString(undefined, { month: "long", year: "numeric" });

    var firstDay = new Date(year, month, 1);
    var startOffset = firstDay.getDay();
    var daysInMonth = new Date(year, month + 1, 0).getDate();

    var grid = document.getElementById("calGrid");
    grid.innerHTML = "";

    var items = allItems();
    var tasksByDay = {};
    items.forEach(function (t) {
      var d = new Date(t.due_at);
      var key = dayKey(d);
      if (!tasksByDay[key]) tasksByDay[key] = [];
      tasksByDay[key].push(t);
    });
    var dotKeyFor = function (t) { return t.is_goal ? "goal" : t.category; };

    var today = new Date();

    for (var i = 0; i < startOffset; i++) {
      var blank = document.createElement("div");
      blank.className = "cal-day empty";
      grid.appendChild(blank);
    }

    var CATS_WITH_GOOGLE = CATS.concat(["google", "goal"]);

    for (var day = 1; day <= daysInMonth; day++) {
      var cellDate = new Date(year, month, day);
      var key = dayKey(cellDate);
      var cell = document.createElement("div");
      cell.className = "cal-day";
      if (dayKey(today) === key) cell.classList.add("today");

      var num = document.createElement("div");
      num.className = "cal-day-num";
      num.textContent = day;
      cell.appendChild(num);

      var dots = document.createElement("div");
      dots.className = "cal-dots";
      var cats = {};
      (tasksByDay[key] || []).forEach(function (t) { cats[dotKeyFor(t)] = true; });
      CATS_WITH_GOOGLE.forEach(function (c) {
        if (cats[c]) {
          var dot = document.createElement("div");
          dot.className = "cal-dot " + c;
          dots.appendChild(dot);
        }
      });
      cell.appendChild(dots);

      (function (key) {
        cell.addEventListener("click", function () { showDayDetail(key, tasksByDay[key] || []); });
      })(key);

      grid.appendChild(cell);
    }
  }

  function showDayDetail(key, dayTasks) {
    selectedDayKey = key;
    var box = document.getElementById("dayDetail");
    if (dayTasks.length === 0) {
      box.style.display = "block";
      box.innerHTML = '<h3>' + key + '</h3><div class="empty-state">No tasks this day.</div>';
      return;
    }
    box.style.display = "block";
    box.innerHTML = "";
    var h = document.createElement("h3");
    h.textContent = key;
    box.appendChild(h);
    dayTasks
      .sort(function (a, b) { return new Date(a.due_at) - new Date(b.due_at); })
      .forEach(function (t) { box.appendChild(renderAgendaItem(t)); });
  }

  var modalOverlay = document.getElementById("modalOverlay");

  function openModal(task) {
    document.getElementById("modalDelete").style.display = task ? "inline-block" : "none";
    document.getElementById("modalTitle").textContent = task ? "Edit Task" : "Add Task";
    document.getElementById("taskId").value = task ? task.id : "";
    document.getElementById("taskTitleInput").value = task ? task.title : "";
    document.getElementById("taskCategoryInput").value = task ? task.category : "school";
    document.getElementById("taskIsGoalInput").checked = task ? !!task.is_goal : false;
    document.getElementById("taskGoalIntervalInput").value = (task && task.goal_reset_interval) ? task.goal_reset_interval : "day";
    document.getElementById("goalIntervalField").style.display = (task && task.is_goal) ? "block" : "none";

    var dueVal = "";
    if (task) {
      var d = new Date(task.due_at);
      dueVal = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    } else {
      var now = new Date();
      now.setMinutes(0, 0, 0);
      now.setHours(now.getHours() + 1);
      dueVal = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
    }
    document.getElementById("taskDueInput").value = dueVal;
    document.getElementById("taskDurationInput").value = task && task.duration_minutes ? task.duration_minutes : 60;

    var existingErr = document.getElementById("modalErrorMsg");
    if (existingErr) existingErr.textContent = "";

    modalOverlay.classList.add("open");
  }

  function openModalPrefilled(fields) {
    document.getElementById("modalDelete").style.display = "none";
    document.getElementById("modalTitle").textContent = "Add Task";
    document.getElementById("taskId").value = "";
    document.getElementById("taskTitleInput").value = fields.title || "";
    document.getElementById("taskCategoryInput").value = fields.category || "other";
    document.getElementById("taskIsGoalInput").checked = false;
    document.getElementById("taskGoalIntervalInput").value = "day";
    document.getElementById("goalIntervalField").style.display = "none";
    document.getElementById("taskDueInput").value = fields.dueLocal;
    document.getElementById("taskDurationInput").value = fields.durationMinutes || 60;

    var existingErr = document.getElementById("modalErrorMsg");
    if (existingErr) existingErr.textContent = "";

    modalOverlay.classList.add("open");
  }

  function closeModal() {
    modalOverlay.classList.remove("open");
  }

  document.getElementById("addFab").addEventListener("click", function () { openModal(null); });
  document.getElementById("modalCancel").addEventListener("click", closeModal);
  document.getElementById("taskIsGoalInput").addEventListener("change", function () {
    document.getElementById("goalIntervalField").style.display = this.checked ? "block" : "none";
  });

  document.getElementById("modalSave").addEventListener("click", function () {
    var id = document.getElementById("taskId").value;
    var title = document.getElementById("taskTitleInput").value.trim();
    var dueRaw = document.getElementById("taskDueInput").value;
    var category = document.getElementById("taskCategoryInput").value;
    var isGoal = document.getElementById("taskIsGoalInput").checked;
    var goalInterval = document.getElementById("taskGoalIntervalInput").value;
    var durationMinutes = parseInt(document.getElementById("taskDurationInput").value, 10) || 60;

    if (!title || !dueRaw) {
      alertInline("Please fill in title and date/time.");
      return;
    }

    var dueIso = new Date(dueRaw).toISOString();

    if (id) {
      var existing = tasks.filter(function (t) { return String(t.id) === String(id); })[0];
      var patch = {
        title: title,
        due_at: dueIso,
        category: category,
        is_goal: isGoal,
        goal_reset_interval: isGoal ? goalInterval : null,
        duration_minutes: durationMinutes
      };
      if (existing && existing.escalated && !isGoal) patch.escalated = false;
      updateTask(id, patch).then(function (res) {
        if (res.error) { alertInline(res.error.message); return; }
        closeModal();
        if (existing) {
          existing.title = title;
          existing.due_at = dueIso;
          existing.category = category;
          existing.is_goal = isGoal;
          existing.goal_reset_interval = isGoal ? goalInterval : null;
          existing.duration_minutes = durationMinutes;
          pushTaskUpdate(existing);
        }
        loadTasks();
      });
    } else {
      addTask({
        title: title,
        due_at: dueIso,
        category: category,
        done: false,
        is_goal: isGoal,
        goal_reset_interval: isGoal ? goalInterval : null,
        escalated: false,
        duration_minutes: durationMinutes
      }).then(function (res) {
        if (res.error) { alertInline(res.error.message); return; }
        closeModal();
        var newRow = res.data && res.data[0];
        if (newRow && isGcalConnected()) {
          pushTaskCreate(newRow).then(function (gcalId) {
            if (gcalId) {
              updateTask(newRow.id, { gcal_event_id: gcalId }).then(function () {
                loadTasks();
                pullGoogleEvents();
              });
            } else {
              loadTasks();
            }
          });
        } else {
          loadTasks();
        }
      });
    }
  });

  document.getElementById("modalDelete").addEventListener("click", function () {
    var id = document.getElementById("taskId").value;
    if (!id) return;
    var existing = tasks.filter(function (t) { return String(t.id) === String(id); })[0];
    deleteTask(id).then(function (res) {
      if (res.error) { alertInline(res.error.message); return; }
      closeModal();
      if (existing && existing.gcal_event_id) {
        pushTaskDelete(existing.gcal_event_id).then(function () {
          loadTasks();
          pullGoogleEvents();
        });
      } else {
        loadTasks();
      }
    });
  });

  // ===================== Quick add (natural language) =====================

  var WEEKDAYS = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"];
  var MONTHS = ["january", "february", "march", "april", "may", "june", "july", "august", "september", "october", "november", "december"];

  function parseNaturalLanguage(text) {
    var original = text;
    var lower = text.toLowerCase();
    var result = { title: null, startDate: null, startTime: null, endTime: null, category: "other" };

    var base = new Date();
    base.setHours(0, 0, 0, 0);

    var dateMatch = null;
    var mToday = /\btoday\b/.exec(lower);
    var mTom = /\btomorrow\b/.exec(lower);
    var mNextWeekday = new RegExp("\\bnext\\s+(" + WEEKDAYS.join("|") + ")\\b").exec(lower);
    var mExplicit = new RegExp("\\b(" + MONTHS.join("|") + ")\\s+(\\d{1,2})(st|nd|rd|th)?\\b").exec(lower);
    var mSlash = /\b(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?\b/.exec(lower);
    var mWeekday = new RegExp("\\b(" + WEEKDAYS.join("|") + ")\\b").exec(lower);

    if (mToday) {
      result.startDate = new Date(base);
      dateMatch = mToday;
    } else if (mTom) {
      var dTom = new Date(base); dTom.setDate(dTom.getDate() + 1);
      result.startDate = dTom;
      dateMatch = mTom;
    } else if (mExplicit) {
      var mi = MONTHS.indexOf(mExplicit[1]);
      var day = parseInt(mExplicit[2], 10);
      var dExp = new Date(base.getFullYear(), mi, day);
      if (dExp < base) dExp.setFullYear(dExp.getFullYear() + 1);
      result.startDate = dExp;
      dateMatch = mExplicit;
    } else if (mSlash) {
      var mm = parseInt(mSlash[1], 10) - 1, dd = parseInt(mSlash[2], 10);
      var yy = mSlash[3] ? (mSlash[3].length === 2 ? 2000 + parseInt(mSlash[3], 10) : parseInt(mSlash[3], 10)) : base.getFullYear();
      result.startDate = new Date(yy, mm, dd);
      dateMatch = mSlash;
    } else if (mNextWeekday) {
      var targetDow = WEEKDAYS.indexOf(mNextWeekday[1]);
      var dNext = new Date(base);
      var diffNext = (targetDow - dNext.getDay() + 7) % 7;
      diffNext += 7; // "next <weekday>" skips the one occurring this week
      dNext.setDate(dNext.getDate() + diffNext);
      result.startDate = dNext;
      dateMatch = mNextWeekday;
    } else if (mWeekday) {
      var targetDow2 = WEEKDAYS.indexOf(mWeekday[1]);
      var dWd = new Date(base);
      var diffWd = (targetDow2 - dWd.getDay() + 7) % 7;
      if (diffWd === 0) diffWd = 7; // the upcoming one, not today, unless "today" was said
      dWd.setDate(dWd.getDate() + diffWd);
      result.startDate = dWd;
      dateMatch = mWeekday;
    } else {
      result.startDate = new Date(base);
    }

    function to24(hStr, mStr, ap) {
      var h = parseInt(hStr, 10);
      var m = mStr ? parseInt(mStr.slice(1), 10) : 0;
      if (ap === "pm" && h < 12) h += 12;
      if (ap === "am" && h === 12) h = 0;
      return { h: h, m: m };
    }

    var timeRangeRe = /\b(\d{1,2})(:\d{2})?\s*(am|pm)?\s*(?:to|-|–|until|till)\s*(\d{1,2})(:\d{2})?\s*(am|pm)?\b/;
    var singleTimeRe = /\b(?:at\s+)?(\d{1,2})(:\d{2})?\s*(am|pm)\b/;
    var tMatch = timeRangeRe.exec(lower);
    var sMatch = null;

    if (tMatch) {
      var ap1 = tMatch[3], ap2 = tMatch[6];
      if (!ap1 && ap2) ap1 = ap2;
      if (!ap2 && ap1) ap2 = ap1;
      result.startTime = to24(tMatch[1], tMatch[2], ap1);
      result.endTime = to24(tMatch[4], tMatch[5], ap2);
    } else if ((sMatch = singleTimeRe.exec(lower))) {
      result.startTime = to24(sMatch[1], sMatch[2], sMatch[3]);
    }

    if (/\b(school|class|assignment|exam|homework|study|lecture)\b/.test(lower)) result.category = "school";
    else if (/\b(movie|game|party|fun|concert|show|entertainment)\b/.test(lower)) result.category = "entertainment";

    var cleaned = original;
    cleaned = cleaned.replace(/\b(please\s+)?book\s+(my\s+)?time\b/i, "");
    cleaned = cleaned.replace(/\bschedule\b/i, "");
    cleaned = cleaned.replace(/\bremind me to\b/i, "");
    if (dateMatch) cleaned = cleaned.replace(new RegExp(dateMatch[0].replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i"), "");
    if (tMatch) cleaned = cleaned.replace(tMatch[0], "");
    else if (sMatch) cleaned = cleaned.replace(sMatch[0], "");
    cleaned = cleaned.replace(/\bon\b/gi, "").replace(/\bat\b/gi, "").replace(/\bfor\b/gi, "").replace(/\bnext\b/gi, "");
    cleaned = cleaned.replace(/\s{2,}/g, " ").replace(/^[\s,.-]+|[\s,.-]+$/g, "").trim();
    if (!cleaned) cleaned = "Untitled event";
    result.title = cleaned.charAt(0).toUpperCase() + cleaned.slice(1);

    return result;
  }

  function runQuickAdd() {
    var input = document.getElementById("quickAddInput");
    var hint = document.getElementById("quickAddHint");
    var text = input.value.trim();
    if (!text) return;

    var parsed = parseNaturalLanguage(text);
    var due = new Date(parsed.startDate);
    if (parsed.startTime) {
      due.setHours(parsed.startTime.h, parsed.startTime.m, 0, 0);
    } else {
      due.setHours(9, 0, 0, 0);
    }

    var durationMinutes = 60;
    if (parsed.startTime && parsed.endTime) {
      var startMins = parsed.startTime.h * 60 + parsed.startTime.m;
      var endMins = parsed.endTime.h * 60 + parsed.endTime.m;
      var diff = endMins - startMins;
      if (diff <= 0) diff += 24 * 60; // range crosses midnight
      durationMinutes = diff;
    }

    var dueLocal = new Date(due.getTime() - due.getTimezoneOffset() * 60000).toISOString().slice(0, 16);

    openModalPrefilled({
      title: parsed.title,
      category: parsed.category,
      dueLocal: dueLocal,
      durationMinutes: durationMinutes
    });

    hint.textContent = "Double-check the details below, then Save.";
    input.value = "";
  }

  document.getElementById("quickAddBtn").addEventListener("click", runQuickAdd);
  document.getElementById("quickAddInput").addEventListener("keydown", function (e) {
    if (e.key === "Enter") runQuickAdd();
  });

  function alertInline(msg) {
    console.error(msg);
    var existing = document.getElementById("modalErrorMsg");
    if (!existing) {
      existing = document.createElement("div");
      existing.id = "modalErrorMsg";
      existing.style.color = "#e53e3e";
      existing.style.fontSize = "0.82rem";
      existing.style.marginTop = "8px";
      document.querySelector(".modal").appendChild(existing);
    }
    existing.textContent = msg;
  }
})();
</script>
